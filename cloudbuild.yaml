steps:
  # Build the container image with caching
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--cache-from'
      - '${_IMAGE_TAG}:latest'
      - '--build-arg'
      - 'NEXT_PUBLIC_WEBAPP_URL=${_NEXT_PUBLIC_WEBAPP_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_V2_URL=${_NEXT_PUBLIC_API_V2_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_LICENSE_CONSENT=${_NEXT_PUBLIC_LICENSE_CONSENT:-}'
      - '--build-arg'
      - 'NEXT_PUBLIC_WEBSITE_TERMS_URL=${_NEXT_PUBLIC_WEBSITE_TERMS_URL:-}'
      - '--build-arg'
      - 'NEXT_PUBLIC_WEBSITE_PRIVACY_POLICY_URL=${_NEXT_PUBLIC_WEBSITE_PRIVACY_POLICY_URL:-}'
      - '--build-arg'
      - 'CALCOM_TELEMETRY_DISABLED=${_CALCOM_TELEMETRY_DISABLED:-}'
      - '--build-arg'
      - 'DATABASE_URL=${_DATABASE_URL:-postgresql://placeholder}'
      - '--build-arg'
      - 'NEXTAUTH_SECRET=${_NEXTAUTH_SECRET:-secret}'
      - '--build-arg'
      - 'CALENDSO_ENCRYPTION_KEY=${_CALENDSO_ENCRYPTION_KEY:-secret}'
      - '--build-arg'
      - 'NEXT_PUBLIC_SINGLE_ORG_SLUG=${_NEXT_PUBLIC_SINGLE_ORG_SLUG:-}'
      - '--build-arg'
      - 'ORGANIZATIONS_ENABLED=${_ORGANIZATIONS_ENABLED:-}'
      - '--build-arg'
      - 'CSP_POLICY=${_CSP_POLICY:-}'
      - '--build-arg'
      - 'MAX_OLD_SPACE_SIZE=${_MAX_OLD_SPACE_SIZE}'
      - '-t'
      - '${_IMAGE_TAG}:${BUILD_ID}'
      - '-t'
      - '${_IMAGE_TAG}:latest'
      - '.'
    id: 'build-image'
    waitFor: ['-']

  # Pull previous image for cache (if exists)
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: bash
    args:
      - '-c'
      - |
        docker pull ${_IMAGE_TAG}:latest || echo "No previous image found, building from scratch"
    id: 'pull-cache'
    waitFor: ['-']
  # Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_IMAGE_TAG}'
    id: 'push-image'
    waitFor: ['build-image']

  # Validate required environment variables before deployment
  - name: 'bash'
    entrypoint: bash
    args:
      - '-c'
      - |
        set -x
        echo "=========================================="
        echo "Validating required environment variables..."
        echo "=========================================="
        
        # Debug: Show all substitution variables
        echo "DEBUG: Checking substitution variables..."
        echo "  _NEXT_PUBLIC_WEBAPP_URL length: $${#_NEXT_PUBLIC_WEBAPP_URL}"
        echo "  _NEXTAUTH_URL length: $${#_NEXTAUTH_URL}"
        echo ""
        echo "Note: DATABASE_URL, NEXTAUTH_SECRET, and CALENDSO_ENCRYPTION_KEY"
        echo "      are loaded from Secret Manager, not substitutions."
        
        # Function to check for newlines, trailing spaces, or breaks
        check_var_clean() {
          local var_name=$$1
          local var_value=$$2
          if echo "$$var_value" | grep -q $'\n\|[[:space:]]$$\|^[[:space:]]'; then
            echo "ERROR: Variable $${var_name} contains newlines, trailing spaces, or leading spaces!"
            echo "Value (first 50 chars): $${var_value:0:50}"
            return 1
          fi
          return 0
        }
        
        MISSING_VARS=()
        DIRTY_VARS=()
        
        # Note: DATABASE_URL, NEXTAUTH_SECRET, and CALENDSO_ENCRYPTION_KEY are now loaded from Secret Manager
        # via --set-secrets flag, so they don't need to be in substitutions anymore.
        # Only checking non-secret variables that must be in substitutions.
        
        # Check NEXT_PUBLIC_WEBAPP_URL (required for build and runtime)
        echo "DEBUG: Checking _NEXT_PUBLIC_WEBAPP_URL..."
        if [ -z "$${_NEXT_PUBLIC_WEBAPP_URL}" ]; then
          echo "DEBUG: _NEXT_PUBLIC_WEBAPP_URL is empty or unset"
          MISSING_VARS+=("_NEXT_PUBLIC_WEBAPP_URL")
        elif ! check_var_clean "_NEXT_PUBLIC_WEBAPP_URL" "$${_NEXT_PUBLIC_WEBAPP_URL}"; then
          DIRTY_VARS+=("_NEXT_PUBLIC_WEBAPP_URL")
        else
          echo "DEBUG: _NEXT_PUBLIC_WEBAPP_URL is set and clean"
        fi
        
        # Check NEXTAUTH_URL (optional - can be empty, will be derived from NEXT_PUBLIC_WEBAPP_URL)
        echo "DEBUG: Checking _NEXTAUTH_URL..."
        if [ -n "$${_NEXTAUTH_URL}" ] && ! check_var_clean "_NEXTAUTH_URL" "$${_NEXTAUTH_URL}"; then
          DIRTY_VARS+=("_NEXTAUTH_URL")
        fi
        
        # Report errors
        echo "=========================================="
        echo "Validation Summary:"
        echo "  Missing variables: $${#MISSING_VARS[@]}"
        echo "  Dirty variables: $${#DIRTY_VARS[@]}"
        echo "=========================================="
        
        if [ $${#MISSING_VARS[@]} -gt 0 ]; then
          echo ""
          echo "ERROR: Missing required environment variables:"
          for var in "$${MISSING_VARS[@]}"; do
            echo "  - $${var}"
          done
          echo ""
          echo "These variables are required for deployment."
          echo ""
          echo "Note: DATABASE_URL, NEXTAUTH_SECRET, and CALENDSO_ENCRYPTION_KEY are"
          echo "      automatically loaded from Secret Manager (calcom-database-url,"
          echo "      calcom-nextauth-secret, calcom-encryption-key)."
          echo ""
          echo "Please update the Cloud Build trigger to include the missing substitutions."
          echo ""
          echo "You can update the trigger using:"
          echo "  gcloud builds triggers update github cal-com-push-to-main --region=global --update-substitutions=_NEXT_PUBLIC_WEBAPP_URL=...,_NEXTAUTH_URL=..."
          exit 1
        fi
        
        if [ $${#DIRTY_VARS[@]} -gt 0 ]; then
          echo ""
          echo "ERROR: Environment variables contain newlines, trailing spaces, or leading spaces:"
          for var in "$${DIRTY_VARS[@]}"; do
            echo "  - $${var}"
          done
          echo ""
          echo "Please clean the environment variables in the Cloud Build trigger configuration."
          exit 1
        fi
        
        echo ""
        echo "✓ All required environment variables are set and clean"
        echo "=========================================="
    id: 'validate-env-vars'
    waitFor: ['push-image']

  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_IMAGE_TAG}:${BUILD_ID}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '${_PORT}'
      - '--memory'
      - '${_MEMORY}'
      - '--cpu'
      - '${_CPU}'
      - '--min-instances'
      - '${_MIN_INSTANCES}'
      - '--max-instances'
      - '${_MAX_INSTANCES}'
      - '--timeout'
      - '${_TIMEOUT}'
      - '--concurrency'
      - '${_CONCURRENCY}'
      - '--startup-probe'
      - 'timeoutSeconds=10,periodSeconds=10,failureThreshold=60,tcpSocket.port=3000'
      - '--set-env-vars'
      - 'NODE_ENV=production,NEXT_PUBLIC_WEBAPP_URL=${_NEXT_PUBLIC_WEBAPP_URL},NEXTAUTH_URL=${_NEXTAUTH_URL}'
      - '--set-secrets'
      - 'DATABASE_URL=calcom-database-url:latest,DATABASE_DIRECT_URL=calcom-database-url:latest,NEXTAUTH_SECRET=calcom-nextauth-secret:latest,CALENDSO_ENCRYPTION_KEY=calcom-encryption-key:latest'
    id: 'deploy-cloud-run-env'
    waitFor: ['validate-env-vars']

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 100

timeout: '7200s'

substitutions:
  _REGION: 'europe-west1'
  _SERVICE_NAME: 'calcom'
  _NEXT_PUBLIC_API_V2_URL: ''
  _IMAGE_TAG: 'gcr.io/${PROJECT_ID}/calcom'
  _PORT: '3000'
  _MEMORY: '4Gi'
  _CPU: '2'
  _MIN_INSTANCES: '0'
  _MAX_INSTANCES: '10'
  _TIMEOUT: '300'
  _CONCURRENCY: '80'
  _MAX_OLD_SPACE_SIZE: '8192'

images:
  - '${_IMAGE_TAG}:${BUILD_ID}'
  - '${_IMAGE_TAG}:latest'

